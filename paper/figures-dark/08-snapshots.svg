e='#f2f2f2' stroke-width='1.5' /><text x='678' y='86' font-size='13' fill='#f2f2f2' text-anchor='start' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Said only when it failed</text><text x='678' y='112' font-size='11.5' fill='#f2f2f2' text-anchor='start' font-weight='400' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>We couldn't load your…</text><text x='678' y='138' font-size='11.5' fill='#f2f2f2' text-anchor='start' font-weight='400' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Try again</text><text x='678' y='180' font-size='11.5' fill='#8f8f8a' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>non-empty text → error shown</text><text x='678' y='198' font-size='11.5' fill='#8f8f8a' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>new button → retry candidate</text><text x='678' y='216' font-size='11.5' fill='#8f8f8a' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>known row still present →</text><text x='678' y='234' font-size='11.5' fill='#8f8f8a' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>working part kept</text><text x='40' y='282' font-size='12' fill='#8f8f8a' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>The grader records the visible lines and buttons in each state and compares sets. It never needs to know what the error says or looks like.</text></svg>