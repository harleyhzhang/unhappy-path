<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' viewBox='0 0 900 302' width='900' height='302'><rect width='900' height='302' fill='#0a0a0a'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#f2f2f2'/></marker><marker id='am' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#8f8f8a'/></marker></defs><text x='40' y='38' font-size='18' fill='#f2f2f2' text-anchor='start' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>How "an error is shown" is decided without a judge</text><rect x='40' y='62' width='184' height='190' rx='8' fill='#141413' stroke='#33332f' stroke-width='1.5' /><text x='54' y='86' font-size='13' fill='#f2f2f2' text-anchor='start' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Normal</text><text x='54' y='110' font-size='11.5' fill='#f2f2f2' text-anchor='start' font-weight='400' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Operating Reserve</text><text x='54' y='136' font-size='11.5' fill='#f2f2f2' text-anchor='start' font-weight='400' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>$56,309.15</text><text x='54' y='162' font-size='11.5' fill='#f2f2f2' text-anchor='start' font-weight='400' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Recent transactions</text><text x='54' y='188' font-size='11.5' fill='#f2f2f2' text-anchor='start' font-weight='400' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Card payment</text><text x='54' y='214' font-size='11.5' fill='#f2f2f2' text-anchor='start' font-weight='400' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Posted</text><rect x='240' y='62' width='184' height='190' rx='8' fill='#141413' stroke='#33332f' stroke-width='1.5' /><text x='254' y='86' font-size='13' fill='#f2f2f2' text-anchor