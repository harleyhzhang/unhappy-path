<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' viewBox='0 0 900 264' width='900' height='264'><rect width='900' height='264' fill='#0a0a0a'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#f2f2f2'/></marker><marker id='am' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#8f8f8a'/></marker></defs><text x='40' y='38' font-size='18' fill='#f2f2f2' text-anchor='start' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>One run, from brief to verdicts</text><rect x='40' y='92' width='140' height='96' rx='8' fill='#1a1a18' stroke='#33332f' stroke-width='1.5' /><text x='110' y='124' font-size='15' fill='#f2f2f2' text-anchor='middle' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Brief</text><text x='110' y='148' font-size='11.5' fill='#8f8f8a' text-anchor='middle' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>product page + API</text><text x='110' y='166' font-size='11.5' fill='#8f8f8a' text-anchor='middle' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>sample data only</text><line x1='182' y1='140' x2='208' y2='140' stroke='#f2f2f2' stroke-width='1.5' marker-end="url(#a)" /><rect x='210' y='92' width='140' height='96' rx='8' fill='#1a1a18' stroke='#33332f' stroke-width='1.5' /><text x='280' y='124' font-size='15' fill='#f2f2f2' text-anchor='middle' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Build</text><text x='280' y='148' font-size='11.5' fill='#8f8f8a' text-anchor='middle' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>agent, 20 min</text><text x='280' y='166' font-size='11.5' fill='#8f8f8a' text-anchor='middle' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>fresh sandbox</text><line x1='352' y1='140' x2='378' y2='140' stroke='#f2f2f2' stroke-width='1.5' marker-end="url(#a)" /><rect x='380' y='92' width='140' height='96' rx='8' fill='#141413' stroke='#f2f2f2' stroke-width='1.5' /><text x='450' y='124' font-size='15' fill='#f2f2f2' text-anchor='middle' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Gate</text><text x='450' y='148' font-size='11.5' fill='#8f8f8a' text-anchor='middle' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>scripted normal flow</text><text x='450' y='166' font-size='11.5' fill='#8f8f8a' text-anchor='middle' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>different data</text><line x1='522' y1='140' x2='548' y2='140' stroke='#f2f2f2' stroke-width='1.5' marker-end="url(#a)" /><rect x='550' y='92' width='140' height='96' rx='8' fill='#141413' stroke='#f2f2f2' stroke-width='1.5' /><text x='620' y='124' font-size='15' fill='#f2f2f2' text-anchor='middle' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Stress</text><text x='620' y='148' font-size='11.5' fill='#8f8f8a' text-anchor='middle' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>up to 14 conditions</text><text x='620' y='166' font-size='11.5' fill='#8f8f8a' text-anchor='middle' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>injected from outside</text><line x1='692' y1='140' x2='718' y2='140' stroke='#f2f2f2' stroke-width='1.5' marker-end="url(#a)" /><rect x='720' y='92' width='140' height='96' rx='8' fill='#141413' stroke='#f2f2f2' stroke-width='1.5' /><text x='790' y='124' font-size='15' fill='#f2f2f2' text-anchor='middle' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Verdicts</text><text x='790' y='148' font-size='11.5' fill='#8f8f8a' text-anchor='middle' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>pass or fail</text><text x='790' y='166' font-size='11.5' fill='#8f8f8a' text-anchor='middle' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>by fixed rule</text><path d='M40,74 H350' stroke='#8f8f8a' stroke-width='1.2' fill='none'/><path d='M380,74 H860' stroke='#e0705a' stroke-width='1.2' fill='none'/><text x='40' y='66' font-size='11' fill='#8f8f8a' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>what the model sees and does</text><text x='380' y='66' font-size='11' fill='#e0705a' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>what the model never sees</text><text x='40' y='224' font-size='12' fill='#8f8f8a' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>The app is copied out of the sandbox, rebuilt from source in a second sandbox and served as static files.</text><text x='40' y='243' font-size='12' fill='#8f8f8a' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Network faults are injected by intercepting its requests in the browser, so the app needs no cooperation.</text></svg>