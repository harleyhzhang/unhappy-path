ize='10.8' fill='#87867f' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>axe: serious or critical</text><rect x='372' y='326' width='156' height='52' rx='7' fill='#ffffff' stroke='#d6d4cb' stroke-width='1.5' /><rect x='372' y='336' width='3' height='32' fill='#d97757'/><text x='386' y='348' font-size='13' fill='#1f1e1d' text-anchor='start' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Announced errors</text><text x='386' y='366' font-size='10.8' fill='#87867f' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>errors reach assistive tech</text></svg>