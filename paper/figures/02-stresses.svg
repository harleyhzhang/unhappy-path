<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' viewBox='0 0 900 400' width='900' height='400'><rect width='900' height='400' fill='#faf9f5'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f1e1d'/></marker><marker id='am' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#87867f'/></marker></defs><text x='40' y='38' font-size='18' fill='#1f1e1d' text-anchor='start' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Eighteen stress categories in two groups</text><text x='40' y='76' font-size='12.5' fill='#5b8bbf' text-anchor='start' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Table stakes: at or near ceiling for every model</text><rect x='40' y='88' width='156' height='52' rx='7' fill='#ffffff' stroke='#d6d4cb' stroke-width='1.5' /><rect x='40' y='98' width='3' height='32' fill='#5b8bbf'/><text x='54' y='110' font-size='13' fill='#1f1e1d' text-anchor='start' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Slow</text><text x='54' y='128' font-size='10.8' fill='#87867f' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>every reply delayed 3 s</text><rect x='206' y='88' width='156' height='52' rx='7' fill='#ffffff' stroke='#d6d4cb' stroke-width='1.5' /><rect x='206' y='98' width='3' height='32' fill='#5b8bbf'/><text x='220' y='110' font-size='13' fill='#1f1e1d' text-anchor='start' font-weight='600' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Failed</text><text x='220' y='128' font-size='10.8' fill='#87867f' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>server error on load</text><rect x='372' y='88' width='156' heigh