cle cx='669' cy='163.5' r='8' fill='#ffffff'/><text x='669' y='168.0' font-size='12' fill='#6f8a55' text-anchor='middle' font-weight='700' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>✕</text><text x='486' y='232' font-size='12' fill='#87867f' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Builds run outside the evaluation tree under a</text><text x='486' y='252' font-size='12' fill='#87867f' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>read deny, each with its own runtime home.</text><text x='486' y='272' font-size='12' fill='#87867f' text-anchor='start' font-weight='400' font-family='ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif'>Seven filesystem controls must pass first.</text></svg>